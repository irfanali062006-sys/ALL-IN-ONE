<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Computer & Digital Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0c101b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #161e31;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid #25334e;
            text-align: center;
        }

        h1 {
            color: #00d2ff;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #8b9bb4;
            font-size: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid #25334e;
            padding-bottom: 15px;
        }

        .section-title {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: left;
            font-weight: 600;
        }

        .services-list {
            list-style: none;
            text-align: left;
            margin-bottom: 30px;
        }

        .services-list li {
            background-color: #1f2c42;
            margin-bottom: 10px;
            padding: 14px;
            border-radius: 8px;
            color: #d1d9e6;
            font-size: 14px;
            display: flex;
            align-items: center;
            border: 1px solid #2e3e5e;
        }

        .services-list li::before {
            content: "✔";
            color: #00d2ff;
            margin-right: 12px;
            font-weight: bold;
        }

        .contact-box {
            background-color: #1f2c42;
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            border-left: 4px solid #00d2ff;
        }

        .contact-box h3 {
            color: #00d2ff;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .contact-box p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Compound Computer</h1>
        <p class="subtitle">Digital & Technology Services</p>

        <h2 class="section-title">Hamari Sevaen:</h2>
        <ul class="services-list">
            <li>Photo Copy aur Printing</li>
            <li>Photo Editing aur Lamination</li>
            <li>Online Form aur Digital Sevaen</li>
            <li>Mobile aur Computer Repairing</li>
        </ul>

        <div class="contact-box">
            <h3>Humse Sampark Karein:</h3>
            <p>📍 Pashkum Village, Kargil, Ladakh</p>
        </div>
    </div>

</body>
</html>
