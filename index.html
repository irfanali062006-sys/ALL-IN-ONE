<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Auth Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
        .auth-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 4px; cursor: pointer; color: white; background-color: #007bff; }
        button.google-btn { background-color: #db4437; }
        button.phone-btn { background-color: #28a745; }
        #recaptcha-container { margin: 10px 0; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Login</h2>
    
    <!-- Email/Password Login -->
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="login-email-btn">Login with Email</button>

    <hr>

    <!-- Google Login -->
    <button class="google-btn" id="login-google-btn">Sign in with Google</button>

    <hr>

    <!-- Phone Login -->
    <input type="tel" id="phone" placeholder="Phone Number (e.g., +91XXXXXXXXXX)">
    <div id="recaptcha-container"></div>
    <button class="phone-btn" id="send-otp-btn">Send OTP</button>
    <input type="text" id="otp" placeholder="Enter OTP" style="display:none;">
    <button id="verify-otp-btn" style="display:none;">Verify OTP</button>
</div>

<script>
    // Initialize Firebase (Apni Firebase config yahan daalein)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 1. Email/Password Login
    document.getElementById('login-email-btn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(email, password)
            .then(() => alert("Logged in with Email!"))
            .catch(err => alert(err.message));
    });

    // 2. Google Login
    const provider = new firebase.auth.GoogleAuthProvider();
    document.getElementById('login-google-btn').addEventListener('click', () => {
        auth.signInWithPopup(provider)
            .then(() => alert("Logged in with Google!"))
            .catch(err => alert(err.message));
    });

    // 3. Phone Authentication
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
    });

    document.getElementById('send-otp-btn').addEventListener('click', () => {
        const phoneNumber = document.getElementById('phone').value;
        const appVerifier = window.recaptchaVerifier;
        auth.signInWithPhoneNumber(phoneNumber, appVerifier)
            .then(confirmationResult => {
                window.confirmationResult = confirmationResult;
                alert("OTP sent!");
                document.getElementById('send-otp-btn').style.display = 'none';
                document.getElementById('phone').style.display = 'none';
                document.getElementById('recaptcha-container').style.display = 'none';
                document.getElementById('otp').style.display = 'block';
                document.getElementById('verify-otp-btn').style.display = 'block';
            }).catch(err => alert(err.message));
    });

    document.getElementById('verify-otp-btn').addEventListener('click', () => {
        const otp = document.getElementById('otp').value;
        window.confirmationResult.confirm(otp)
            .then(() => alert("Logged in with Phone!"))
            .catch(err => alert(err.message));
    });
</script>

</body>
</html>
