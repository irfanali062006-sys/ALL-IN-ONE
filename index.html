<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Multi-Auth & AI Assistant</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            gap: 25px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .auth-container, .chat-container {
            background: #ffffff;
            color: #333;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 380px;
            max-width: 100%;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #4a4a75;
            font-size: 22px;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #4a4a75;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:active {
            transform: scale(0.98);
        }
        .email-btn { background-color: #4a4a75; color: white; }
        .email-btn:hover { background-color: #38385a; }
        .google-btn { background-color: #db4437; color: white; }
        .google-btn:hover { background-color: #c23325; }
        .phone-btn { background-color: #28a745; color: white; }
        .phone-btn:hover { background-color: #218838; }
        
        .divider {
            text-align: center;
            margin: 15px 0;
            color: #777;
            font-size: 13px;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 38%;
            height: 1px;
            background: #ddd;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        /* AI Assistant Chat Styles */
        .chat-box {
            height: 240px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            background: #f8fafc;
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 9px 13px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
        }
        .ai-msg {
            background: #e2e8f0;
            color: #1e293b;
            align-self: flex-start;
        }
        .user-msg {
            background: #4a4a75;
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            padding: 10px;
            margin: 0;
            padding-left: 12px;
        }
        .chat-input-area button {
            width: 75px;
            margin: 0;
            padding: 10px;
            background-color: #4a4a75;
            color: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<!-- Authentication Section -->
<div class="auth-container">
    <h2><i class="fa-solid fa-lock"></i> Secure Login</h2>
    
    <!-- Email/Password Section -->
    <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="email" placeholder="Email Address">
    </div>
    <div class="input-group">
        <i class="fa-solid fa-key"></i>
        <input type="password" id="password" placeholder="Password">
    </div>
    <button class="email-btn" id="login-email-btn"><i class="fa-solid fa-right-to-bracket"></i> Login with Email</button>

    <div class="divider">OR</div>

    <!-- Google Login Section -->
    <button class="google-btn" id="login-google-btn"><i class="fa-brands fa-google"></i> Sign in with Google</button>

    <div class="divider">OR</div>

    <!-- Phone Authentication Section -->
    <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="tel" id="phone" placeholder="Phone Number (+91...)">
    </div>
    <div id="recaptcha-container"></div>
    <button class="phone-btn" id="send-otp-btn"><i class="fa-solid fa-paper-plane"></i> Send OTP</button>
    
    <div class="input-group" id="otp-group" style="display:none;">
        <i class="fa-solid fa-shield-halved"></i>
        <input type="text" id="otp" placeholder="Enter 6-digit OTP">
    </div>
    <button class="phone-btn" id="verify-otp-btn" style="display:none;"><i class="fa-solid fa-check"></i> Verify OTP</button>
</div>

<!-- AI Help Chat Section -->
<div class="chat-container">
    <h2><i class="fa-solid fa-robot"></i> AI Help Assistant</h2>
    <div class="chat-box" id="chat-box">
        <div class="message ai-msg">Namaste! Main aapka AI Assistant hoon. Login, Email, Google ya Phone OTP se judi koi bhi madad chahiye toh aap mujhse pooch sakte hain!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ask AI anything...">
        <button id="send-chat-btn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // ==========================================
    // 1. FIREBASE CONFIGURATION & INITIALIZATION
    // ==========================================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ==========================================
    // 2. EMAIL / PASSWORD AUTHENTICATION
    // ==========================================
    document.getElementById('login-email-btn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if(!email || !password) {
            alert("Please enter both email and password!");
            return;
        }

        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                alert("Email Login Successful! Welcome " + userCredential.user.email);
            })
            .catch(err => alert("Error: " + err.message));
    });

    // ==========================================
    // 3. GOOGLE AUTHENTICATION
    // ==========================================
    const googleProvider = new firebase.auth.GoogleAuthProvider();
    document.getElementById('login-google-btn').addEventListener('click', () => {
        auth.signInWithPopup(googleProvider)
            .then((result) => {
                alert("Google Login Successful! Welcome " + result.user.displayName);
            })
            .catch(err => alert("Error: " + err.message));
    });

    // ==========================================
    // 4. PHONE OTP AUTHENTICATION
    // ==========================================
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
    });

    document.getElementById('send-otp-btn').addEventListener('click', () => {
        const phoneNumber = document.getElementById('phone').value;
        if(!phoneNumber) {
            alert("Please enter a valid phone number with country code (e.g., +91...)");
            return;
        }

        const appVerifier = window.recaptchaVerifier;
        auth.signInWithPhoneNumber(phoneNumber, appVerifier)
            .then(confirmationResult => {
                window.confirmationResult = confirmationResult;
                alert("OTP Sent Successfully!");
                document.getElementById('phone').style.display = 'none';
                document.getElementById('send-otp-btn').style.display = 'none';
                document.getElementById('recaptcha-container').style.display = 'none';
                document.getElementById('otp-group').style.display = 'block';
                document.getElementById('verify-otp-btn').style.display = 'flex';
            }).catch(err => alert("SMS Error: " + err.message));
    });

    document.getElementById('verify-otp-btn').addEventListener('click', () => {
        const otp = document.getElementById('otp').value;
        if(!otp) {
            alert("Please enter the OTP!");
            return;
        }

        window.confirmationResult.confirm(otp)
            .then((result) => {
                alert("Phone Login Successful! Welcome " + result.user.phoneNumber);
            })
            .catch(err => alert("Invalid OTP: " + err.message));
    });

    // ==========================================
    // 5. AI ASSISTANT CHATBOT LOGIC
    // ==========================================
    const chatBox = document.getElementById('chat-box');
    const chatInput = document.getElementById('chat-input');
    const sendChatBtn = document.getElementById('send-chat-btn');

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}-msg`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleAIChat() {
        const query = chatInput.value.trim();
        if (!query) return;

        appendMessage(query, 'user');
        const userQueryLower = query.toLowerCase();
        chatInput.value = '';

        // AI Smart Responses
        setTimeout(() => {
            let aiReply = "Main samajh nahi paya. Aap Login, Google, Phone OTP ya Firebase setup ke baare me pooch sakte hain!";
            
            if (userQueryLower.includes('google') || userQueryLower.includes('gmail')) {
                aiReply = "Google se login karne ke liye 'Sign in with Google' button par click karein. Yeh popup open karega.";
            } else if (userQueryLower.includes('phone') || userQueryLower.includes('otp') || userQueryLower.includes('mobile')) {
                aiReply = "Phone OTP ke liye apna number country code ke sath daalein (jaise +91...) aur 'Send OTP' dabayein.";
            } else if (userQueryLower.includes('email') || userQueryLower.includes('password')) {
                aiReply = "Email aur password box me apni details daal kar 'Login with Email' button click karein.";
            } else if (userQueryLower.includes('error') || userQueryLower.includes('domain')) {
                aiReply = "Agar unauthorized domain error aaye, toh Firebase Console ke Authentication settings me jakar apna live domain add karein.";
            } else if (userQueryLower.includes('hello') || userQueryLower.includes('hi') || userQueryLower.includes('hey')) {
                aiReply = "Hello! Bataiye, main aapki kya sahayata kar sakta hoon?";
            }

            appendMessage(aiReply, 'ai');
        }, 500);
    }

    sendChatBtn.addEventListener('click', handleAIChat);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAIChat();
    });
</script>

</body>
</html>
